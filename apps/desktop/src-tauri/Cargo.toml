[package]
name = "partnest-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "partnest_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
calamine = "0.36.1"
chrono = "0.4.45"
csv = "1.4.0"
encoding_rs = "0.8.35"
hex = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tempfile = "3.23.0"
tauri = { version = "2", features = [] }
uuid = { version = "1.24.1", features = ["v4", "v7"] }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
